    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #FFF4DE; overflow: hidden; overscroll-behavior: none; position: fixed; inset: 0; }
      * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #FFF4DE; touch-action: none; }
      #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; color: #2B2D42; background: #FFF4DE; transition: opacity .4s; z-index: 5; }
      #bar { width: 260px; height: 14px; background: #e8dcc6; border-radius: 7px; overflow: hidden; margin-top: 14px; }
      #fill { height: 100%; width: 0; background: #FF7A45; border-radius: 7px; transition: width .2s; }
      #fs { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); padding: 8px 16px; border: 0; border-radius: 10px; background: rgba(43,45,66,.75); color: #fff; font: bold 16px sans-serif; cursor: pointer; display: none; z-index: 6; }
      #rotate { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #FFF4DE; color: #2B2D42; font-family: sans-serif; text-align: center; z-index: 10; padding: 24px; }
      #rotate .phone { width: 70px; height: 120px; border: 6px solid #2B2D42; border-radius: 14px; margin-bottom: 24px; animation: turn 1.6s ease-in-out infinite; }
      @keyframes turn { 0%, 20% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <button id="fs">⛶ เต็มจอ</button>
    <div id="rotate"><div class="phone"></div><div style="font-size:26px;font-weight:bold">กรุณาหมุนโทรศัพท์เป็นแนวนอน</div><div style="font-size:16px;margin-top:8px;opacity:.7">เกมนี้เล่นในแนวนอนเท่านั้น</div></div>
    <div id="loader"><div style="font-size:28px;font-weight:bold">นักสืบวิทย์เมืองช่าง</div><div style="font-size:16px;margin-top:6px">กำลังโหลดเกม...</div><div id="bar"><div id="fill"></div></div></div>
    <script>

                if (i >= reqs.length) { ctrl.close(); return; }

      })();

    <script src="Build/WebGL.loader.js?v=20260921-1652"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
      var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
      function lockLandscape() { try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {}); } catch (e) {} }
      function goFullscreen(u) {
        try {
          var el = document.documentElement;
          if (el.requestFullscreen) el.requestFullscreen().then(lockLandscape).catch(function () { u.SetFullscreen(1); });
          else u.SetFullscreen(1);
        } catch (e) { try { u.SetFullscreen(1); } catch (e2) {} }
      }
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb?v=20260921-1652",

      }, function (p) { document.getElementById("fill").style.width = Math.round(p * 100) + "%"; })
      .then(function (u) {
        var l = document.getElementById("loader"); l.style.opacity = 0; setTimeout(function () { l.remove(); }, 400);
        var b = document.getElementById("fs");

</html>
